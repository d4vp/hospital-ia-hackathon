[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# `pytest` alone measures coverage and FAILS below the threshold in .coveragerc (90%).
# For a quick partial run use:  pytest tests/test_x.py --no-cov
addopts = --cov=app --cov-config=.coveragerc --cov-report=term
filterwarnings =
    ignore::DeprecationWarning
